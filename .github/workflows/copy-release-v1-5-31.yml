name: Temporary v1.5.31 release asset transfer
on:
  workflow_dispatch:
    inputs:
      blobs:
        description: Verified release asset Git blob references; empty checks access only
        required: false
        default: ""
        type: string
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify and transfer existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          COPY_REPOSITORY: ${{ github.repository }}
          COPY_BLOBS: ${{ inputs.blobs }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, tempfile
          
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          
          repository = os.environ['COPY_REPOSITORY']
          release_id = 412515906
          expected = [{"name": "CSV-nyaan-Viewer-1.5.31-source.zip", "size": 2897435, "sha256": "0c0e3b43d51c2892cc74ae9cae055a8577284e674cd15cfdefdd414218821f7d"}, {"name": "CSV-nyaan-Viewer-1.5.31-Windows-x64.zip", "size": 166986473, "sha256": "98d7b03c500d9c36e331ddfd8d13e81f4b7ce346101cfe9e4961ea826b4cdadc"}, {"name": "SHA256SUMS.txt", "size": 371, "sha256": "314fd16ebb7b7530527eac3e82621aa3534ed973b1c981433ce465a6e4b6275a"}, {"name": "SIGNATURE.json", "size": 639, "sha256": "3efcf4e66fad58a29ecbfeba4b1f21146cc49cc02b4f4f73199cf3ca7b5046b4"}, {"name": "test-signing.cer", "size": 1038, "sha256": "eaca5c9dd3b9a0c7a3a85a608991bcae082c9de3b6e78254efab4b162c989916"}]
          release = api(f'repos/{repository}/releases/{release_id}')
          assert release['draft'] and release['tag_name'] == 'v1.5.31', 'Unexpected release state'
          mapping_text = os.environ['COPY_BLOBS']
          if not mapping_text:
              print('Workflow credentials and draft release access verified')
              raise SystemExit(0)
          mapping = json.loads(mapping_text)
          assert set(mapping) == {a['name'] for a in expected}, 'Unexpected transfer manifest'
          actual = {a['name']: a for a in release['assets']}
          assert set(actual).issubset(mapping), 'Unexpected draft asset'
          with tempfile.TemporaryDirectory() as directory:
              for item in expected:
                  name = item['name']
                  path = pathlib.Path(directory) / name
                  with path.open('wb') as stream:
                      for sha in mapping[name]:
                          assert len(sha) == 40 and all(ch in '0123456789abcdef' for ch in sha)
                          blob = api(f'repos/{repository}/git/blobs/{sha}')
                          assert blob['encoding'] == 'base64'
                          chunk = base64.b64decode(blob['content'])
                          actual_sha = hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest()
                          assert actual_sha == sha, 'Git blob checksum mismatch'
                          stream.write(chunk)
                  assert path.stat().st_size == item['size'], 'Release asset size mismatch'
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert digest == item['sha256'], 'Release asset checksum mismatch'
                  existing = actual.get(name)
                  if existing:
                      assert existing.get('digest') == 'sha256:' + digest and existing['size'] == item['size'], 'Existing asset differs'
                  else:
                      subprocess.run(['gh', 'release', 'upload', 'v1.5.31', str(path), '--repo', repository], check=True)
                  print('Verified and uploaded ' + name, flush=True)
          print('All five assets transferred; release remains a draft')
          PY
